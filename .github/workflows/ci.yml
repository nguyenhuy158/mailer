name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No unit tests. `pnpm build` (`wrangler deploy --dry-run`) catches
  # bundle-time errors the typecheck misses; `pnpm e2e` starts `wrangler dev`
  # and runs the HTTP smoke suites (plain fetch, no browser).
  check:
    uses: nguyenhuy158/kit/.github/workflows/check.yml@v0.1.0
    with:
      run-build: true
      run-e2e: true
